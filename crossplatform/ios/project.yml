name: FreeNetHub
options:
  bundleIdPrefix: com.freenethub
targets:
  FreeNetHub:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [FreeNetHub]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.freenethub.app
      MARKETING_VERSION: 4.2.0
      CURRENT_PROJECT_VERSION: 420
      CODE_SIGN_ENTITLEMENTS: FreeNetHub/FreeNetHub.entitlements
    dependencies:
      - target: PacketTunnel
  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources: [PacketTunnel]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.freenethub.app.PacketTunnel
      MARKETING_VERSION: 4.2.0
      CURRENT_PROJECT_VERSION: 420
      CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
      INFOPLIST_FILE: PacketTunnel/Info.plist
