name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify public manifests
        run: python tests/verify_public_tree.py
      - name: Scan public tree for private/runtime material
        run: python tests/security_scan_public.py
      - name: Verify mobile fail-closed gates
        run: python crossplatform/common/verify_fail_closed.py
      - name: R53 revision-aware update and installer identity
        run: python tests/test_r53_release_identity.py
      - name: Installer owned-process shutdown bounded-wait regression
        shell: pwsh
        run: ./tests/test_prepare_upgrade_wait.ps1
      - name: Execute mocked V481 fail-start DNS firewall guard lifecycle
        shell: pwsh
        run: ./tests/test_pc_dns_guard_failstart.ps1
      - name: Check V481 watchdog identity access fail-closed on Windows
        shell: pwsh
        run: ./tests/test_pc_dns_guard_identity.ps1
      - name: Validate V481 exact-owner DNS firewall watchdog on isolated hosted Windows
        shell: pwsh
        run: ./tests/test_pc_dns_guard_watchdog_hosted.ps1
      - name: Engine unit tests
        run: python tests/test_engine.py
      - name: Reject stale Windows node health and throughput data
        run: python tests/test_node_health_freshness.py
      - name: Gateway unit tests
        run: python gateway/tests/test_gateway.py
      - name: Clean self-contained packaging regression
        run: python -m unittest tests.test_clean_install
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $files=@('app/FreeNetHub.ps1','Install-Windows.ps1','Setup-WindowsDependencies.ps1','Uninstall-FreeNetHub.ps1','windows/installer/Prepare-Upgrade.ps1','tests/test_prepare_upgrade_wait.ps1','tests/test_pc_dns_guard_failstart.ps1','tests/test_pc_dns_guard_identity.ps1','tests/test_pc_dns_guard_watchdog_hosted.ps1')
          $files += Get-ChildItem gateway -Filter *.ps1 -File | ForEach-Object FullName
          foreach($f in $files){
            $t=$null;$e=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$e)|Out-Null
            if(@($e).Count){$e|ForEach-Object{$_.Message};exit 1}
          }
  linux-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux static checks
        run: |
          python3 -m py_compile crossplatform/linux/freenet_hub_linux.py crossplatform/linux/freenet_hub_linux_r37.py crossplatform/linux/freenet_hub_linux_gtk.py crossplatform/linux/nodehub_shared.py crossplatform/linux/warp_guard.py crossplatform/linux/selftest.py crossplatform/linux/test_console_policy.py crossplatform/linux/test_private_state_permissions.py crossplatform/linux/test_r37_parity.py crossplatform/linux/test_update_revision.py
          python3 crossplatform/linux/selftest.py
          python3 crossplatform/linux/test_console_policy.py
          python3 crossplatform/linux/test_private_state_permissions.py
          python3 crossplatform/linux/test_browser_profile.py
          python3 crossplatform/linux/test_scope_policy.py
          python3 crossplatform/linux/test_warp_tos_owner_consent.py
          python3 crossplatform/linux/test_r37_parity.py
          python3 crossplatform/linux/test_update_revision.py
          python3 tests/test_v462_mixed_release_update.py
          python3 tests/test_linux_browser_action_guards.py
          python3 tests/test_linux_site_diagnostics_auto.py
          python3 tests/test_node_health_freshness.py
          python3 tests/test_linux_install_active_guard.py
          # Compare against the immutable PUBLIC R20 release, never repack new source under the old R20 filename.
          mkdir -p delivery/github_v4.2.0
          curl -fLsS --retry 2 --max-time 70 \
            https://github.com/GOD13emad/FreeNetHub/releases/download/v4.3.9-r53-windows-stable/FreeNetHub_4.2.0_Linux_R20.zip \
            -o delivery/github_v4.2.0/FreeNetHub_4.2.0_Linux_R20.zip
          python3 tests/verify_frozen_linux_r20_asset.py
          python3 tests/build_linux_r21_package.py
          python3 tests/test_linux_r21_upgrade_preserves_data.py
          rm -rf /tmp/fnh-r20-ci && mkdir -p /tmp/fnh-r20-ci
          unzip -q delivery/github_v4.2.0/FreeNetHub_4.2.0_Linux_R20.zip -d /tmp/fnh-r20-ci
          cd /tmp/fnh-r20-ci/FreeNetHub_4.2.0_Linux_R20
          sha256sum -c SHA256SUMS.txt
          for f in selftest.py test_browser_profile.py test_console_policy.py test_private_state_permissions.py test_scope_policy.py test_r37_parity.py test_update_revision.py; do python3 "$f"; done
          cd "$GITHUB_WORKSPACE"
          bash -n crossplatform/linux/install.sh crossplatform/linux/uninstall.sh crossplatform/linux/install_warp_official.sh crossplatform/linux/install_singbox_pinned.sh crossplatform/linux/install_warpplus_pinned.sh crossplatform/linux/recover_warp_remote.sh
  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Guard Android 16 submission toolchain
        run: |
          grep -q 'compileSdk=36' crossplatform/android/app/build.gradle.kts
          grep -q 'targetSdk=36' crossplatform/android/app/build.gradle.kts
          grep -q 'version "8.10.1"' crossplatform/android/build.gradle.kts
      - name: Guard unlinked Android VPN is not registered with the OS
        run: |
          python3 - <<'PYNOINACTIVEVPN'
          import pathlib
          import xml.etree.ElementTree as ET
          manifest=ET.parse('crossplatform/android/app/src/main/AndroidManifest.xml').getroot()
          a='{http://schemas.android.com/apk/res/android}'
          services=[x for x in manifest.iter('service') if x.get(a+'name')=='.FreeNetVpnService']
          assert not services, 'UNLINKED_VPN_MUST_NOT_REGISTER_SYSTEM_SERVICE'
          source=pathlib.Path('crossplatform/android/app/src/main/java/com/freenethub/mobile/FreeNetVpnService.kt').read_text()
          assert 'providerCoreReady(): Boolean = false' in source, 'PROVIDER_GUARD_SCOPE_CHANGED'
          activity=pathlib.Path('crossplatform/android/app/src/main/java/com/freenethub/mobile/MainActivity.kt').read_text()
          assert 'VpnService.prepare' not in activity, 'PREMATURE_VPN_PERMISSION'
          print('UNLINKED_ANDROID_VPN_UNREGISTERED_PASS')
          PYNOINACTIVEVPN
      - name: Build fail-closed Android integration pack
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        working-directory: crossplatform/android
        run: gradle :app:assembleDebug --stacktrace
  ios-static:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Guard App Store 2026 Apple toolchain
        run: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          test "$XCODE_MAJOR" -ge 26
          SDK_MAJOR="$(xcrun --sdk iphonesimulator --show-sdk-version | cut -d. -f1)"
          test "$SDK_MAJOR" -ge 26
      - name: Validate Apple plists and Swift syntax
        run: |
          plutil -lint crossplatform/ios/FreeNetHub/FreeNetHub.entitlements
          plutil -lint crossplatform/ios/PacketTunnel/PacketTunnel.entitlements
          plutil -lint crossplatform/ios/PacketTunnel/Info.plist
          xcrun swiftc -parse crossplatform/ios/FreeNetHub/FreeNetHubApp.swift crossplatform/ios/FreeNetHub/ContentView.swift
          xcrun swiftc -parse crossplatform/ios/PacketTunnel/PacketTunnelProvider.swift

  console-virtual-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Virtual console TCP/UDP/source-isolation E2E
        run: |
          python3 gateway/tests/virtual_console_e2e.py
          sudo bash gateway/tests/virtual_console_netns_e2e.sh

  windows-virtual-signing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise ephemeral Authenticode signing pipeline
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'FnhSignProbe.cs'
          $exe=Join-Path $env:RUNNER_TEMP 'FnhSignProbe.exe'
          Set-Content -LiteralPath $src -Encoding ASCII -Value 'public static class Program { public static void Main() {} }'
          $csc=Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Filter csc.exe -Recurse | Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if(-not $csc){ throw 'csc.exe not found' }
          & $csc /nologo /target:exe /out:$exe $src
          if($LASTEXITCODE){ exit $LASTEXITCODE }
          if((Get-AuthenticodeSignature -LiteralPath $exe).Status -ne 'NotSigned'){ throw 'probe PE unexpectedly pre-signed' }
          ./tests/virtual_codesign.ps1 -InputPath $exe
          if(Get-ChildItem Cert:\CurrentUser\My | Where-Object Subject -eq 'CN=FreeNetHub Virtual Signing Validation'){ throw 'virtual signing certificate residue' }
          if(Get-ChildItem tests -Directory -Filter '.virtual-sign-*' -ErrorAction SilentlyContinue){ throw 'virtual signing file residue' }

  android-emulator-runtime:
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Install Android emulator image
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          test -x "$SDKMANAGER" && test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-36" "build-tools;35.0.0" "system-images;android-36;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd --force --name fnh_ci --package "system-images;android-36;google_apis;x86_64"
          AVD_INI="$(find "$HOME" "$ANDROID_SDK_ROOT" "$RUNNER_TEMP" -type f -name 'fnh_ci.ini' -print -quit 2>/dev/null || true)"
          if [ -z "$AVD_INI" ]; then
            echo 'AVD metadata was not created'
            find "$HOME/.android" "$ANDROID_SDK_ROOT" "$RUNNER_TEMP" -maxdepth 4 -type f 2>/dev/null | sort | tail -200 || true
            exit 1
          fi
          AVD_HOME="$(dirname "$AVD_INI")"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          echo "Resolved AVD home: $AVD_HOME"
          cat "$AVD_INI"
          sudo chmod 666 /dev/kvm || true
      - name: Boot emulator and validate fail-closed runtime
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          EMU="$ANDROID_SDK_ROOT/emulator/emulator"
          test -x "$ADB" && test -x "$EMU"
          "$ADB" version
          "$ADB" start-server
          if "$EMU" -accel-check; then ACCEL=on; else ACCEL=off; fi
          echo "Android emulator acceleration: $ACCEL"
          nohup "$EMU" -avd fnh_ci -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -no-metrics -gpu swiftshader_indirect -accel "$ACCEL" >/tmp/fnh-emulator.log 2>&1 &
          EMU_PID=$!
          sleep 5
          if ! kill -0 "$EMU_PID" 2>/dev/null; then
            cat /tmp/fnh-emulator.log
            echo 'Emulator exited before ADB became available'
            exit 1
          fi
          if ! timeout 150s "$ADB" wait-for-device; then
            cat /tmp/fnh-emulator.log
            echo 'ADB device deadline exceeded'
            exit 1
          fi
          BOOTED=0
          for i in $(seq 1 90); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then BOOTED=1; break; fi
            sleep 2
          done
          if [ "$BOOTED" != "1" ]; then
            cat /tmp/fnh-emulator.log
            "$ADB" shell getprop || true
            echo 'Android boot-complete deadline exceeded'
            exit 1
          fi
          "$ADB" shell input keyevent 82 || true
          BEFORE="$("$ADB" shell ip -o link | sed -E 's/^[0-9]+: ([^:]+):.*/\1/' | sort)"

          # Activity launch completion does not guarantee that the accessibility
          # hierarchy already contains the target state. Poll that state with a
          # bounded deadline; persistent mismatches remain hard failures.
          dump_until_contains() {
            local remote_path="$1"
            local local_path="$2"
            local needle="$3"
            local label="$4"
            local attempt state
            rm -f "$local_path"
            for attempt in $(seq 1 15); do
              "$ADB" wait-for-device >/dev/null 2>&1 || true
              state="$("$ADB" get-state 2>/dev/null || true)"
              if [ "$state" = "device" ] \
                && "$ADB" shell uiautomator dump "$remote_path" >/tmp/fnh-uiautomator-last.txt 2>&1 \
                && "$ADB" pull "$remote_path" "$local_path" >/dev/null 2>&1 \
                && grep -Fq "$needle" "$local_path"; then
                echo "UI hierarchy ready: $label (attempt $attempt)"
                return 0
              fi
              sleep 1
            done
            echo "UI hierarchy deadline exceeded: $label"
            "$ADB" get-state || true
            cat /tmp/fnh-uiautomator-last.txt 2>/dev/null || true
            if [ -f "$local_path" ]; then cat "$local_path"; fi
            tail -200 /tmp/fnh-emulator.log 2>/dev/null || true
            return 1
          }
          cd crossplatform/android
          gradle :app:assembleDebug --stacktrace
          "$ADB" install -r app/build/outputs/apk/debug/app-debug.apk
          "$ADB" shell am start -W -n com.freenethub.mobile/.MainActivity | tee /tmp/fnh-am-start.txt
          grep -q 'Status: ok' /tmp/fnh-am-start.txt
          dump_until_contains /sdcard/fnh-window.xml /tmp/fnh-window.xml \
            'Provider core: NOT LINKED. No TUN will be established.' 'initial app fail-closed state'

          # An unlinked provider must never take VPN ownership from another app.
          # Android grants only one app the VPN right at a time.
          if grep -Fq 'VpnService.prepare(' app/src/main/java/com/freenethub/mobile/MainActivity.kt; then
            echo 'Unlinked provider still requests VPN ownership'
            exit 1
          fi
          if grep -Fq 'Request VPN permission' /tmp/fnh-window.xml; then
            echo 'Unlinked provider exposes misleading permission action'
            exit 1
          fi
          # The essential runtime invariant is that no consent path is exposed,
          # no VPN service starts, and existing network interfaces remain stable.
          # Avoid an exact enabled/text UIAutomator match: it is renderer-dependent.
          if "$ADB" shell dumpsys activity services | grep -q 'com.freenethub.mobile/.FreeNetVpnService'; then
            echo 'Unlinked VPN service unexpectedly running'
            exit 1
          fi

          "$ADB" shell am force-stop com.freenethub.mobile
          "$ADB" shell am start -W -n com.freenethub.mobile/.MainActivity | tee /tmp/fnh-am-relaunch.txt
          grep -q 'Status: ok' /tmp/fnh-am-relaunch.txt

          AFTER="$("$ADB" shell ip -o link | sed -E 's/^[0-9]+: ([^:]+):.*/\1/' | sort)"
          test "$BEFORE" = "$AFTER"
          if "$ADB" shell dumpsys activity services | grep -q 'com.freenethub.mobile/.FreeNetVpnService'; then
            echo 'VPN service unexpectedly running'
            exit 1
          fi
          "$ADB" shell pm path com.freenethub.mobile | grep -q '^package:'
          "$ADB" emu kill || true

  ios-simulator-runtime:
    needs: ios-static
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate and build simulator app
        working-directory: crossplatform/ios
        run: |
          xcodegen generate
          xcodebuild -project FreeNetHub.xcodeproj -scheme FreeNetHub -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP=build/Build/Products/Debug-iphonesimulator/FreeNetHub.app
          APPEX="$APP/PlugIns/PacketTunnel.appex"
          test -d "$APP"
          test -d "$APPEX"
          EXT_EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist")"
          test -n "$EXT_EXEC" && test -x "$APPEX/$EXT_EXEC"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist")" = 'com.freenethub.app.PacketTunnel'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist")" = 'com.apple.networkextension.packet-tunnel'
          grep -Fq 'completionHandler(ProviderError.coreNotLinked)' PacketTunnel/PacketTunnelProvider.swift
          if grep -Fq 'setTunnelNetworkSettings' PacketTunnel/PacketTunnelProvider.swift; then
            echo 'Packet tunnel unexpectedly configures network settings without a forwarding core'
            exit 1
          fi
      - name: Boot simulator, install and launch
        working-directory: crossplatform/ios
        run: |
          UDID="$(python3 - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          for runtime,devices in d['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for dev in devices:
                  if dev.get('isAvailable') and dev.get('name','').startswith('iPhone'):
                      print(dev['udid']); raise SystemExit
          raise SystemExit('NO_AVAILABLE_IPHONE_SIMULATOR')
          PY
          )"
          test -n "$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          APP=build/Build/Products/Debug-iphonesimulator/FreeNetHub.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.freenethub.app | tee /tmp/fnh-ios-launch.txt
          grep -q 'com.freenethub.app:' /tmp/fnh-ios-launch.txt
          INSTALLED_APP="$(xcrun simctl get_app_container "$UDID" com.freenethub.app app)"
          test -d "$INSTALLED_APP"
          test -d "$INSTALLED_APP/PlugIns/PacketTunnel.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INSTALLED_APP/PlugIns/PacketTunnel.appex/Info.plist")" = 'com.freenethub.app.PacketTunnel'
          xcrun simctl io "$UDID" screenshot /tmp/fnh-ios-runtime.png >/dev/null
          test -s /tmp/fnh-ios-runtime.png
          xcrun simctl terminate "$UDID" com.freenethub.app
          RELAUNCH_OUT="$(xcrun simctl launch "$UDID" com.freenethub.app)"
          echo "$RELAUNCH_OUT" | tee /tmp/fnh-ios-relaunch.txt
          grep -Eq '^com.freenethub.app: [0-9]+$' /tmp/fnh-ios-relaunch.txt
          sleep 2
          xcrun simctl io "$UDID" screenshot /tmp/fnh-ios-relaunch.png >/dev/null
          test -s /tmp/fnh-ios-relaunch.png

  windows-installer-fresh:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $candidates=@(
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe')
          )
          $iscc=$candidates|Where-Object{$_ -and (Test-Path -LiteralPath $_)}|Select-Object -First 1
          if(-not $iscc){
            choco install innosetup --no-progress -y
            $iscc=$candidates|Where-Object{$_ -and (Test-Path -LiteralPath $_)}|Select-Object -First 1
          }
          if(-not $iscc){ throw 'ISCC_NOT_FOUND_AFTER_INSTALL' }
          Write-Host "ISCC=$iscc"
      - name: Checkout immutable R53 baseline for historical installer compatibility
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 17daff34805b82bcae0c6e8d5e6cbed6258c50ff
          path: r53-baseline
          persist-credentials: false
      - name: Build exact immutable FreeNet Hub 4.3.9 R53 installer
        shell: pwsh
        run: |
          $baseline=Join-Path $PWD 'r53-baseline'
          $expected='17daff34805b82bcae0c6e8d5e6cbed6258c50ff'
          if((git -C $baseline rev-parse HEAD).Trim() -ne $expected){throw 'R53_IMMUTABLE_BASELINE_COMMIT_MISMATCH'}
          & pwsh.exe -NoProfile -NonInteractive -File (Join-Path $baseline 'tests\build_v439_installer.ps1')
          if($LASTEXITCODE -ne 0){throw 'R53_IMMUTABLE_BASELINE_BUILD_FAIL'}
          $source=Join-Path $baseline 'delivery\github_v4.3.9\FreeNetHub_4.3.9_R53_Setup.exe'
          $target=Join-Path $PWD 'delivery\github_v4.3.9\FreeNetHub_4.3.9_R53_Setup.exe'
          if(!(Test-Path -LiteralPath $source)){throw 'R53_IMMUTABLE_BASELINE_BINARY_MISSING'}
          New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force|Out-Null
          Copy-Item -LiteralPath $source -Destination $target -Force
          if((Get-FileHash $target).Hash -ne (Get-FileHash $source).Hash){throw 'R53_IMMUTABLE_BINARY_COPY_MISMATCH'}
          Write-Host ('R53_IMMUTABLE_BASELINE_PACKAGE_PASS_SHA256='+(Get-FileHash $target).Hash)
      - name: Fresh install exact artifact into absent app directory
        shell: pwsh
        run: |
          $installer=(Resolve-Path 'delivery\github_v4.3.9\FreeNetHub_4.3.9_R53_Setup.exe').Path
          $probe=Join-Path $env:RUNNER_TEMP 'fnh-v439-r53-fresh'
          Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue
          if(Test-Path -LiteralPath $probe){ throw 'FRESH_PROBE_DIR_PREEXISTS' }
          $p=Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR="+$probe)) -Wait -PassThru
          if($p.ExitCode -ne 0){ throw ('V439_FRESH_INSTALL_EXIT_'+$p.ExitCode) }
          foreach($rel in @('FreeNetHub.exe','RELEASE.json','app\FreeNetHub.ps1','app\dependencies.json','INSTALL_RUNTIME_STATUS.json','PWSH_PATH.txt')){
            if(!(Test-Path -LiteralPath (Join-Path $probe $rel))){ throw ('V439_FRESH_INSTALL_MISSING_'+$rel) }
          }
          $release=Get-Content -LiteralPath (Join-Path $probe 'RELEASE.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$release.version -ne '4.3.9'){ throw 'V439_FRESH_INSTALL_VERSION_MISMATCH' }
          if([string]$release.releaseRevision -ne '4.3.9-r53-inno-root-guard'){ throw 'V439_FRESH_INSTALL_REVISION_MISMATCH' }
          $uiError=Join-Path $probe 'logs\ui-error.txt'
          Remove-Item -LiteralPath $uiError -Force -ErrorAction SilentlyContinue
          $launcher=Start-Process -FilePath (Join-Path $probe 'FreeNetHub.exe') -ArgumentList @((Join-Path $probe 'app\FreeNetHub.ps1')) -PassThru
          Start-Sleep -Seconds 6
          if($launcher.HasExited){ throw ('V439_UI_LAUNCHER_EXITED_'+$launcher.ExitCode) }
          $child=@(Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $launcher.Id -and $_.Name -eq 'pwsh.exe' })
          if($child.Count -lt 1){ throw 'V439_UI_CHILD_PWSH_MISSING' }
          if(Test-Path -LiteralPath $uiError){ throw ('V439_UI_ERROR_'+(Get-Content -Raw -LiteralPath $uiError)) }
          Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue

      - name: Upgrade R51 to R53 on isolated Windows runner and verify file hashes
        shell: pwsh
        run: |
          $oldUrl='https://github.com/GOD13emad/FreeNetHub/releases/download/v4.3.7-r20-linux-cfon-smart/FreeNetHub_4.3.7_R51_Setup.exe'
          $old=Join-Path $env:RUNNER_TEMP 'FreeNetHub_4.3.7_R51_Setup.exe'
          & curl.exe -fL --retry 2 --connect-timeout 12 --max-time 120 -o $old $oldUrl
          if($LASTEXITCODE){throw 'R51_DOWNLOAD_FAILED'}
          if((Get-FileHash $old -Algorithm SHA256).Hash -ne '8283803146E1625A31F0223487A63C05D7B7D9C3D8B59D1A7432D14AB9D4FF11'){throw 'R51_PUBLIC_ASSET_HASH_MISMATCH'}
          $probe=Join-Path $env:RUNNER_TEMP 'fnh-r51-to-r53'
          $r51=Start-Process -FilePath $old -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR="+$probe)) -Wait -PassThru
          if($r51.ExitCode -ne 0){throw ('R51_INITIAL_INSTALL_EXIT_'+$r51.ExitCode)}
          $installed=Join-Path $probe 'RELEASE.json'
          if(!(Test-Path $installed)){throw 'R51_INITIAL_INSTALL_MISSING'}
          $v51=Get-Content $installed -Raw|ConvertFrom-Json
          if($v51.releaseRevision -ne '4.3.7-r51-protocol-expansion-2'){throw 'R51_INITIAL_REVISION_WRONG'}
          $new=(Resolve-Path 'delivery\github_v4.3.9\FreeNetHub_4.3.9_R53_Setup.exe').Path
          $r52=Start-Process -FilePath $new -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR="+$probe)) -Wait -PassThru
          if($r52.ExitCode -ne 0){throw ('R53_UPGRADE_INSTALL_EXIT_'+$r52.ExitCode)}
          $v53=Get-Content $installed -Raw|ConvertFrom-Json
          if($v53.releaseRevision -ne '4.3.9-r53-inno-root-guard'){throw 'R53_UPGRADE_REVISION_WRONG'}
          $manifest=Get-Content (Join-Path $probe 'app\manifest.json') -Raw|ConvertFrom-Json
          foreach($row in $manifest.code){
            $source=Join-Path (Join-Path $probe 'app') $row.file
            if(!(Test-Path $source)){throw ('R53_UPGRADE_FILE_MISSING_'+$row.file)}
            if((Get-FileHash $source -Algorithm SHA256).Hash -ne [string]$row.sha256){throw ('R53_UPGRADE_CODE_HASH_BAD_'+$row.file)}
          }
          if([string]$manifest.coreVersion -ne '4.3.9-r53-inno-root-guard'){throw 'R53_UPGRADE_CORE_VERSION_BAD'}
          Write-Host 'R51_TO_R53_REAL_INNO_UPGRADE_APP_HASHES_PASS'
      - name: Explicit rollback R53 to SHA256-pinned public R51 on same Windows test installation
        shell: pwsh
        run: |
          # The rollback is an explicit operator action; automatic update still
          # blocks downgrades. The active user PC is never part of this test.
          $old=Join-Path $env:RUNNER_TEMP 'FreeNetHub_4.3.7_R51_Setup.exe'
          $probe=Join-Path $env:RUNNER_TEMP 'fnh-r51-to-r53'
          $installed=Join-Path $probe 'RELEASE.json'
          if(!(Test-Path -LiteralPath $old)){throw 'R51_ROLLBACK_INSTALLER_MISSING'}
          if((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash -ne '8283803146E1625A31F0223487A63C05D7B7D9C3D8B59D1A7432D14AB9D4FF11'){throw 'R51_ROLLBACK_INSTALLER_HASH_BAD'}
          if(!(Test-Path -LiteralPath $installed)){throw 'R53_PRE_ROLLBACK_RELEASE_MISSING'}
          $before=Get-Content -LiteralPath $installed -Raw | ConvertFrom-Json
          if($before.releaseRevision -ne '4.3.9-r53-inno-root-guard'){throw 'R53_PRE_ROLLBACK_REVISION_BAD'}
          # Forensics only: never alter or skip immutable R51's safety check.
          # Do not print the full Gateway session (may contain user metadata).
          $gatewayControl=Join-Path $probe 'gateway\gateway_control.ps1'
          $pyCheck=Get-Command python.exe -ErrorAction SilentlyContinue
          Write-Host ('R51_ROLLBACK_STATUS_DIAG_GATEWAY_PRESENT='+(Test-Path -LiteralPath $gatewayControl))
          Write-Host ('R51_ROLLBACK_STATUS_DIAG_DEPENDENCIES_PRESENT='+(Test-Path -LiteralPath (Join-Path $probe 'app\dependencies.json')))
          Write-Host ('R51_ROLLBACK_STATUS_DIAG_PYTHON_COMMAND_PRESENT='+[bool]$pyCheck)
          if(Test-Path -LiteralPath $gatewayControl){
            $diagOutput=@(& pwsh.exe -NoProfile -NonInteractive -File $gatewayControl -Action Status 2>&1)
            $diagExit=$LASTEXITCODE
            $diagText=($diagOutput|Out-String).Trim()
            Write-Host ('R51_ROLLBACK_STATUS_DIAG_EXIT='+$diagExit)
            try {
              $parsed=$diagText|ConvertFrom-Json -ErrorAction Stop
              Write-Host ('R51_ROLLBACK_STATUS_DIAG_JSON_EXIT='+[string]$parsed.exit)
              Write-Host ('R51_ROLLBACK_STATUS_DIAG_JSON_ERROR='+[string]$parsed.result.error)
            }catch{
              # Exact errors only; redact any line resembling encoded token/key.
              foreach($line in @($diagOutput)|Select-Object -First 8){
                $safe=[string]$line
                $safe=$safe -replace '(?i)(token|password|secret|api_key|key)\s*[=:]\s*[^\s,]+','$1=[REDACTED]'
                Write-Host ('R51_ROLLBACK_STATUS_DIAG_STDERR='+$safe.Substring(0,[Math]::Min($safe.Length,300)))
              }
            }
          }
          # Preserve the original rollback assertion, but diagnose setup stage
          # rejections instead of reporting only the Inno return code.
          $rollbackLog=Join-Path $env:RUNNER_TEMP 'fnh-r51-explicit-rollback-inno.log'
          $rollback=Start-Process -FilePath $old -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR="+$probe),("/LOG="+$rollbackLog)) -Wait -PassThru
          if($rollback.ExitCode -ne 0){
            Write-Host ('R51_ROLLBACK_EXIT='+$rollback.ExitCode)
            if(Test-Path -LiteralPath $rollbackLog){
              Write-Host 'R51_ROLLBACK_SETUP_LOG_LAST_80'
              Get-Content -LiteralPath $rollbackLog -Tail 80 | ForEach-Object { Write-Host $_ }
            }else{Write-Host 'R51_ROLLBACK_INNO_LOG_MISSING'}
            throw ('R51_EXPLICIT_ROLLBACK_EXIT_'+$rollback.ExitCode)
          }
          $after=Get-Content -LiteralPath $installed -Raw | ConvertFrom-Json
          if($after.releaseRevision -ne '4.3.7-r51-protocol-expansion-2'){throw 'R51_ROLLBACK_REVISION_BAD'}
          $manifest=Get-Content -LiteralPath (Join-Path $probe 'app\manifest.json') -Raw | ConvertFrom-Json
          foreach($row in $manifest.code){
            $file=Join-Path (Join-Path $probe 'app') $row.file
            if(!(Test-Path -LiteralPath $file)){throw ('R51_ROLLBACK_CODE_MISSING_'+$row.file)}
            if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne [string]$row.sha256){throw ('R51_ROLLBACK_CODE_HASH_BAD_'+$row.file)}
          }
          if(!(Test-Path -LiteralPath (Join-Path $probe 'FreeNetHub.exe'))){throw 'R51_ROLLBACK_GUI_MISSING'}
          Write-Host 'R51_TO_R53_UPGRADE_AND_EXPLICIT_R51_ROLLBACK_PASS'

      - name: Reject duplicate AppId destinations without touching active installs
        shell: pwsh
        run: |
          # Only on an isolated ephemeral Windows CI runner, never the user PC.
          $installer=(Resolve-Path 'delivery\github_v4.3.9\FreeNetHub_4.3.9_R53_Setup.exe').Path
          $probe=Join-Path $env:RUNNER_TEMP 'fnh-r51-to-r53'
          $canonical=Join-Path $env:LOCALAPPDATA 'Programs\FreeNetHub'
          $oldRegistry='HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{BCE83A4E-8897-4D52-A650-BB67A2BB8142}_is1'
          if(Test-Path -LiteralPath $canonical){throw 'CI_CANONICAL_ROOT_UNEXPECTEDLY_PRESENT'}
          $before=(Get-Content -LiteralPath (Join-Path $probe 'RELEASE.json') -Raw|ConvertFrom-Json).releaseRevision
          if($before -ne '4.3.7-r51-protocol-expansion-2'){throw 'CI_PRECONDITION_R51_WRONG'}
          $regBefore=(Get-ItemProperty -LiteralPath $oldRegistry).InstallLocation
          if(([IO.Path]::GetFullPath($regBefore).TrimEnd('\')) -ne ([IO.Path]::GetFullPath($probe).TrimEnd('\'))){throw 'CI_REGISTERED_ROOT_WRONG'}
          try {
            New-Item -ItemType Directory -Path $canonical | Out-Null
            Set-Content -LiteralPath (Join-Path $canonical 'RELEASE.json') -Value '{"version":"4.3.7"}' -Encoding utf8NoBOM
            foreach($destination in @($probe,$canonical)){
              $run=Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR="+$destination)) -Wait -PassThru
              if($run.ExitCode -eq 0){throw ('DUPLICATE_INSTALL_GUARD_BYPASSED_'+$destination)}
              $unchanged=(Get-Content -LiteralPath (Join-Path $probe 'RELEASE.json') -Raw|ConvertFrom-Json).releaseRevision
              if($unchanged -ne $before){throw 'DUPLICATE_INSTALL_OVERWROTE_R51'}
              if((Get-ItemProperty -LiteralPath $oldRegistry).InstallLocation -ne $regBefore){throw 'DUPLICATE_INSTALL_CHANGED_REGISTRATION'}
            }
            Write-Host 'DUPLICATE_APPID_ROOT_FAIL_CLOSED_PASS'
          } finally {
            if(Test-Path -LiteralPath $canonical){Remove-Item -LiteralPath $canonical -Recurse -Force}
          }


      - name: Upgrade pinned public R52 to R53 and preserve profile, then explicit rollback
        shell: pwsh
        run: |
          # Fresh isolated directory on GitHub-hosted runner, NOT a real user computer.
          $oldUrl='https://github.com/GOD13emad/FreeNetHub/releases/download/v4.3.8-r52-windows-stable/FreeNetHub_4.3.8_R52_Setup.exe'
          $old=Join-Path $env:RUNNER_TEMP 'FreeNetHub_4.3.8_R52_Setup.exe'
          & curl.exe -fL --retry 2 --connect-timeout 12 --max-time 120 -o $old $oldUrl
          if($LASTEXITCODE){throw 'R52_DOWNLOAD_FAILED'}
          if((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash -ne 'A48F689B22940C9D752FADB6372B849948B18192F3A30D4FC3971C15827F9883'){throw 'R52_PINNED_HASH_BAD'}
          $dir=Join-Path $env:RUNNER_TEMP 'fnh-r52-to-r53'
          if(Test-Path $dir){throw 'R52_TEST_ROOT_EXISTS'}
          $i=Start-Process -FilePath $old -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR="+$dir)) -Wait -PassThru
          if($i.ExitCode -ne 0){throw ('R52_INITIAL_INSTALL_EXIT_'+$i.ExitCode)}
          $v=(Get-Content -Raw (Join-Path $dir 'RELEASE.json')|ConvertFrom-Json).releaseRevision
          if($v -ne '4.3.8-r52-stale-node-health-ttl'){throw 'R52_INITIAL_VERSION_BAD'}
          $userData=Join-Path $dir 'data\owner-preservation-probe.txt'
          New-Item -ItemType Directory -Path (Split-Path -Parent $userData) -Force | Out-Null
          Set-Content -LiteralPath $userData -Value 'preserve-fixture-20261014' -NoNewline
          $settings=Join-Path $dir 'settings.json'
          Set-Content -LiteralPath $settings -Value '{"ownerPreservationFixture":"yes"}' -NoNewline
          $new=(Resolve-Path 'delivery\github_v4.3.9\FreeNetHub_4.3.9_R53_Setup.exe').Path
          $upgrade=Start-Process -FilePath $new -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR="+$dir)) -Wait -PassThru
          if($upgrade.ExitCode -ne 0){throw ('R53_UPGRADE_EXIT_'+$upgrade.ExitCode)}
          $r53=(Get-Content -Raw (Join-Path $dir 'RELEASE.json')|ConvertFrom-Json)
          if($r53.releaseRevision -ne '4.3.9-r53-inno-root-guard'){throw 'R53_REVISION_MISMATCH'}
          $am=Get-Content -Raw (Join-Path $dir 'app\manifest.json')|ConvertFrom-Json
          if($am.coreVersion -ne $r53.releaseRevision){throw 'R53_MANIFEST_VERSION_MISMATCH'}
          foreach($row in $am.code) {
            $f=Join-Path (Join-Path $dir 'app') $row.file
            if(!(Test-Path $f) -or (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash -ne [string]$row.sha256){throw ('R53_CODE_HASH_BAD_'+$row.file)}
          }
          if((Get-Content -Raw $settings|ConvertFrom-Json).ownerPreservationFixture -ne 'yes'){throw 'SETTINGS_NOT_PRESERVED'}
          if((Get-Content -Raw $userData) -ne 'preserve-fixture-20261014'){throw 'DATA_NOT_PRESERVED'}
          $reg='HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{BCE83A4E-8897-4D52-A650-BB67A2BB8142}_is1'
          $loc=(Get-ItemProperty $reg).InstallLocation
          if(([IO.Path]::GetFullPath($loc).TrimEnd('\')) -ne ([IO.Path]::GetFullPath($dir).TrimEnd('\'))){throw 'UPGRADE_UNINSTALL_ROOT_CHANGED'}
          $rollback=Start-Process -FilePath $old -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR="+$dir)) -Wait -PassThru
          if($rollback.ExitCode -ne 0){throw ('R53_TO_R52_ROLLBACK_EXIT_'+$rollback.ExitCode)}
          if((Get-Content -Raw (Join-Path $dir 'RELEASE.json')|ConvertFrom-Json).releaseRevision -ne '4.3.8-r52-stale-node-health-ttl'){throw 'R52_RESTORE_BAD'}
          if(!(Test-Path $settings) -or !(Test-Path $userData)){throw 'ROLLBACK_LOST_USER_DATA'}
          Write-Host 'R52_TO_R53_DATA_PRESERVATION_AND_EXPLICIT_R52_ROLLBACK_PASS'


