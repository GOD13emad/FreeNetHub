name: CodeQL advanced six-language analysis

# Dormant until the reviewed main workflow and explicit cutover are ready.
# Default setup blocks CodeQL SARIF uploads; see docs/CODEQL_CUTOVER.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  existing-languages-codeql:
    if: vars.FNH_ADVANCED_CODEQL_ENABLED == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language: [actions, csharp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934
        with:
          category: /language:${{ matrix.language }}
          upload: always

  android-codeql:
    if: vars.FNH_ADVANCED_CODEQL_ENABLED == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Install existing CI Android SDK prerequisites
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile Android Kotlin without build cache
        working-directory: crossplatform/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon --no-build-cache --rerun-tasks :app:assembleDebug --stacktrace
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934
        with:
          category: /language:java-kotlin
          upload: always

  swift-codeql:
    if: vars.FNH_ADVANCED_CODEQL_ENABLED == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate existing simulator project
        working-directory: crossplatform/ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934
        with:
          languages: swift
          build-mode: manual
      - name: Compile simulator application and extension
        working-directory: crossplatform/ios
        run: |
          xcodebuild -project FreeNetHub.xcodeproj -scheme FreeNetHub -configuration Debug -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/fnh-codeql-derived" CODE_SIGNING_ALLOWED=NO clean build
          test -d "$RUNNER_TEMP/fnh-codeql-derived/Build/Products/Debug-iphonesimulator/FreeNetHub.app/PlugIns/PacketTunnel.appex"
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934
        with:
          category: /language:swift
          upload: always
