name: R54 isolated install and upgrade acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/r54-isolated-acceptance.yml'
      - 'tests/prepare_r54_isolated.py'
      - 'tests/test_r54_isolated_upgrade.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-windows:
    name: R54 private ${{ matrix.mode }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, upgrade]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate pinned-source preparation script
        shell: pwsh
        run: |
          python -m py_compile tests/prepare_r54_isolated.py
          if ($LASTEXITCODE -ne 0) { throw 'R54_STAGE_SCRIPT_INVALID' }
          $base='e4112be36d6cce97863c59a5dbe6a5d0bcdf5786'
          if ((git rev-list -n 1 $base) -ne $base) { throw 'R54_ACCEPTED_BASE_NOT_PRESENT' }
      - name: Isolated R54 Windows install, update, and rollback
        shell: pwsh
        run: ./tests/test_r54_isolated_upgrade.ps1 -Mode ${{ matrix.mode }}
