name: Windows public signing gate (no certificate required for CI)
on:
  push:
    paths:
      - '.github/workflows/windows-signing-gate.yml'
      - 'scripts/signing/**'
      - 'docs/CODE_SIGNING_POLICY.md'
  pull_request:
    paths:
      - '.github/workflows/windows-signing-gate.yml'
      - 'scripts/signing/**'
      - 'docs/CODE_SIGNING_POLICY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell verification gate
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          foreach ($path in @('scripts/signing/Test-PublicAuthenticode.ps1','scripts/signing/Sign-FirstPartyStaging.ps1','scripts/signing/Update-R52StagedIntegrity.ps1','scripts/signing/Invoke-R52SignedInno.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count -ne 0) { $errors | ForEach-Object Message; exit 1 }
          }
      - name: Reject unsigned PowerShell artifact (negative regression)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'fnh-sign-gate-fixture'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -LiteralPath (Join-Path $dir 'Unsigned.ps1') -Encoding utf8 -Value 'Write-Output "unsigned"'
          $unsignedSha = (Get-FileHash -LiteralPath (Join-Path $dir 'Unsigned.ps1') -Algorithm SHA256).Hash
          $manifest = @{
            schema = 1
            publisherSubject = 'CN=Public Verification Fixture (intentionally absent)'
            publisherThumbprint = '0000000000000000000000000000000000000000'
            artifacts = @(@{ path='Unsigned.ps1'; ownership='first-party'; expectedSha256=$unsignedSha })
          } | ConvertTo-Json -Depth 5
          Set-Content -LiteralPath (Join-Path $dir 'manifest.json') -Encoding utf8 -Value $manifest
          & pwsh.exe -NoProfile -NonInteractive -File 'scripts/signing/Test-PublicAuthenticode.ps1' -ArtifactRoot $dir -ManifestPath (Join-Path $dir 'manifest.json') -ReportPath (Join-Path $dir 'report.json')
          if ($LASTEXITCODE -ne 1) { throw 'FAIL_CLOSED_GATE_DID_NOT_REJECT_UNSIGNED_FIXTURE' }
          $report = Get-Content -LiteralPath (Join-Path $dir 'report.json') -Raw | ConvertFrom-Json
          if ($report.verdict -ne 'FAIL' -or $report.passed -ne 0 -or $report.count -ne 1) {
            throw 'FAIL_CLOSED_REPORT_INVALID'
          }
          # GitHub's pwsh wrapper propagates a child's nonzero LASTEXITCODE
          # even when the exit code is the expected negative-test result.
          $global:LASTEXITCODE = 0
          Remove-Item -LiteralPath $dir -Recurse -Force
      - name: Reject omitted runnable artifacts and incorrect SHA pin
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'fnh-sign-gate-missing'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $script = Join-Path $dir 'Declared.ps1'
          Set-Content -LiteralPath $script -Encoding utf8 -Value 'Write-Output "declared"'
          Set-Content -LiteralPath (Join-Path $dir 'Undeclared.ps1') -Encoding utf8 -Value 'Write-Output "omitted"'
          $sha = (Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash
          $manifest = @{
            schema = 1
            publisherSubject = 'CN=Missing Fixture'
            publisherThumbprint = '0000000000000000000000000000000000000000'
            artifacts = @(@{path='Declared.ps1';ownership='first-party';expectedSha256=$sha})
          }
          $json = Join-Path $dir 'manifest.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $json -Encoding utf8
          & pwsh.exe -NoProfile -NonInteractive -File 'scripts/signing/Test-PublicAuthenticode.ps1' -ArtifactRoot $dir -ManifestPath $json -ReportPath (Join-Path $dir 'omission.json')
          if ($LASTEXITCODE -ne 1) { throw 'OMITTED_CODE_NOT_REJECTED' }
          $o = Get-Content -LiteralPath (Join-Path $dir 'omission.json') -Raw | ConvertFrom-Json
          if ($o.verdict -ne 'FAIL' -or 'Undeclared.ps1' -notin @($o.missingFromManifest)) { throw 'OMISSION_NOT_RECORDED' }
          $manifest.artifacts[0].expectedSha256 = ('0' * 64)
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $json -Encoding utf8
          & pwsh.exe -NoProfile -NonInteractive -File 'scripts/signing/Test-PublicAuthenticode.ps1' -ArtifactRoot $dir -ManifestPath $json -ReportPath (Join-Path $dir 'bad-sha.json')
          if ($LASTEXITCODE -ne 1) { throw 'SHA_MISMATCH_NOT_REJECTED' }
          $s = Get-Content -LiteralPath (Join-Path $dir 'bad-sha.json') -Raw | ConvertFrom-Json
          if ($s.files[0].reasons -notcontains 'FINAL_SIGNED_SHA256_MISMATCH') { throw 'SHA_MISMATCH_NOT_RECORDED' }
          $global:LASTEXITCODE = 0
          Remove-Item -LiteralPath $dir -Recurse -Force
      - name: Reject signing without real certificate and leave staged bytes intact
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'signer-source-fixture'
          $stage = Join-Path $env:RUNNER_TEMP 'signer-stage-fixture'
          New-Item -Path $src,$stage -ItemType Directory -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $stage 'Sample.ps1') -Value 'Write-Output "must stay unsigned"' -Encoding utf8
          $hash = (Get-FileHash -LiteralPath (Join-Path $stage 'Sample.ps1') -Algorithm SHA256).Hash
          @{purpose='SINGLE_USE_SIGNED_BUILD';sourceCommit='fixture';status='READY_TO_SIGN'} |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $stage '.signing-staging-authority.json') -Encoding utf8
          @{schema=1;files=@(@{path='Sample.ps1';ownership='first-party';expectedUnsignedSha256=$hash})} |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $stage 'signing-plan.json') -Encoding utf8
          $signArgs = @{
            StageRoot=$stage
            SourceRoot=$src
            PlanPath=(Join-Path $stage 'signing-plan.json')
            PublisherThumbprint='0000000000000000000000000000000000000000'
            PublisherSubject='CN=Not A Public Signing Credential'
            TimestampUrl='http://timestamp.digicert.com'
            SignToolPath=(Join-Path $PSHOME 'pwsh.exe')
          }
          & pwsh.exe -NoProfile -NonInteractive -File 'scripts/signing/Sign-FirstPartyStaging.ps1' -StageRoot $signArgs.StageRoot -SourceRoot $signArgs.SourceRoot -PlanPath $signArgs.PlanPath -PublisherThumbprint $signArgs.PublisherThumbprint -PublisherSubject $signArgs.PublisherSubject -TimestampUrl $signArgs.TimestampUrl -SignToolPath $signArgs.SignToolPath
          if ($LASTEXITCODE -ne 1) { throw 'MISSING_PUBLIC_SIGNER_NOT_REJECTED' }
          if ((Get-FileHash -LiteralPath (Join-Path $stage 'Sample.ps1') -Algorithm SHA256).Hash -ne $hash) {
            throw 'UNAUTHORIZED_STAGE_MUTATION'
          }
          $global:LASTEXITCODE = 0
          Remove-Item -LiteralPath $stage,$src -Recurse -Force
      - name: Confirm no release or private key was generated
        shell: pwsh
        run: |
          if (Test-Path '.github/workflows/sign-and-release.yml') {
            Write-Output 'Separate signed release workflow exists; review its authority before enabling'
          }
          Write-Output 'VERIFIER_REGRESSION_ONLY: no CA trust or release claimed'
